name: "client-binary"

on:
  push:
    tags: [ 'v*.*.*' ]
  workflow_dispatch:

permissions:
    contents: write

jobs:
  releases-matrix:
    name: Release Go Binary
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin]
        goarch: [amd64, arm64]
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Release Client Binary
        uses: wangyoucao577/go-release-action@481a2c1a0f1be199722e3e9b74d7199acafc30a8 # v1.53
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          goos: ${{ matrix.goos }}
          goarch: ${{ matrix.goarch }}
          goversion: "1.27.3"
          project_path: client
          binary_name: istio-upgrade-consumer-client
          asset_name: "istio-upgrade-consumer-client-${{ matrix.goos }}-${{ matrix.goarch }}"