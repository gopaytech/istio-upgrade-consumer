apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Values.configuration.storageConfigMapNamespace }}
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}
    helm.sh/chart: {{ template "istio-upgrade-consumer.chart" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  resourceNames: ["{{ .Values.configuration.storageConfigMapName }}"]
  verbs: ["get", "update"]
# create cannot be restricted by resourceNames
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["create"]
